# Production domain: app.oblikos.ru. Provision TLS with your ACME client first.
# Install inside nginx http context; use certbot --nginx for initial TLS issuance.
limit_req_zone $binary_remote_addr zone=oblikos_auth:10m rate=10r/m;
server {
    listen 80;
    server_name app.oblikos.ru;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name app.oblikos.ru;
    ssl_certificate /etc/letsencrypt/live/app.oblikos.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.oblikos.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Private media is streamed through application auth. Never alias media dir.
    client_max_body_size 12m;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
    proxy_connect_timeout 5s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    location /api/auth/ {
        limit_req zone=oblikos_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
    }
    # Public content lives on the main domain; avoid a duplicate on the app host.
    location = /blog { return 301 https://oblikos.ru$request_uri; }
    location ^~ /blog/ { return 301 https://oblikos.ru$request_uri; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
    }
    # Default nginx combined access logs include token query strings. Disable
    # app access logging until a query-free log_format is configured.
    access_log off;
}
