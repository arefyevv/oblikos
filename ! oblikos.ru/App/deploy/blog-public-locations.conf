# Include INSIDE the existing HTTPS server block for oblikos.ru.
# Keep its existing root, TLS configuration and location / for the Vite landing.
# Blog pages never require forwarding private /api or /dashboard routes.
location = /blog {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location ^~ /blog/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
}
location = /icon.svg {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
}
location = /sitemap.xml {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
}
location = /robots.txt {
    # Main domain owns the public landing rules; app subdomain stays noindex.
    try_files /robots.txt =404;
}
